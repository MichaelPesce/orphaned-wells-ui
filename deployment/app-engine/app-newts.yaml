service: newts-uow
runtime: python310
runtime_config:
  python_version: 3.10
handlers:
  # Serve static files (JS, CSS, images, fonts, etc. Excludes .map source maps)
  - url: /(.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|txt))
    static_files: build/\1
    upload: build/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|txt)
    secure: always
    expiration: "7d"

  # SPA routes: serve index.html for known client-side application routes
  - url: /((index\.html|login|project|projects|record|records|record_group|schema|admin|users)(/.*)?)?$
    static_files: build/index.html
    upload: build/index.html
    secure: always
    expiration: "1s"