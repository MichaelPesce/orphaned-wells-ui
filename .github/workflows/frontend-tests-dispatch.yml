name: App Tests Dispatch

on:
  workflow_call:
    inputs:
      checkout_repository:
        description: Repository to check out and test.
        required: false
        type: string
        default: CATALOG-Historic-Records/orphaned-wells-ui
      checkout_ref:
        description: Branch, tag, or SHA to check out.
        required: false
        type: string
        default: main
      install_python_package:
        description: Install an additional Python package into the backend container before E2E tests. Use this when calling the workflow from OGRRE_data_cleaning.
        required: false
        type: boolean
        default: false
      python_package_repository:
        description: Python package repository to check out. Defaults to the caller repository when install_python_package is true.
        required: false
        type: string
        default: ""
      python_package_ref:
        description: Branch, tag, or SHA for the Python package checkout. Defaults to the caller SHA when install_python_package is true.
        required: false
        type: string
        default: ""
      python_package_path:
        description: Workspace path for the Python package checkout.
        required: false
        type: string
        default: caller-python-package
    secrets:
      checkout_token:
        description: Optional token for checking out a private or internal repository.
        required: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  frontend-tests:
    name: Frontend testing (${{ matrix.os }})
    runs-on: ${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        include:
          - os: linux
            os-version: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}
          token: ${{ secrets.checkout_token || github.token }}

      - name: Check out Python package under test
        if: ${{ inputs.install_python_package }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.python_package_repository || github.repository }}
          ref: ${{ inputs.python_package_ref || github.sha }}
          path: ${{ inputs.python_package_path }}
          token: ${{ secrets.checkout_token || github.token }}

      - name: Install JS dependencies
        run: npm clean-install

      - name: Run component tests
        run: npm test

      - name: Configure test environment
        run: |
          cp deployment/.env.e2e.example deployment/.env.e2e

          set_env() {
            file="$1"
            key="$2"
            value="$3"
            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$file"
            else
              echo "${key}=${value}" >> "$file"
            fi
          }

          set_env deployment/.env.e2e BACKEND_MODE image
          set_env deployment/.env.e2e REACT_APP_BACKEND_URL http://localhost:8002
          set_env deployment/.env.e2e REACT_APP_COLLABORATOR isgs
          set_env deployment/.env.e2e REACT_APP_GOOGLE_CLIENTID cypress-test-client-id.apps.googleusercontent.com
          set_env deployment/.env.e2e REQUIRE_AUTH false
          set_env deployment/.env.e2e ALLOWED_ORIGINS http://localhost:3001
          set_env deployment/.env.e2e SESSION_COOKIE_DOMAIN ""
          set_env deployment/.env.e2e SESSION_COOKIE_SECURE false
          set_env deployment/.env.e2e SESSION_COOKIE_SAMESITE lax

      - name: Start docker containers
        run: npm run docker:e2e

      - name: Install Python package under test in backend container
        if: ${{ inputs.install_python_package }}
        env:
          PYTHON_PACKAGE_PATH: ${{ inputs.python_package_path }}
        run: |
          compose=(docker compose --env-file deployment/.env.e2e -f deployment/docker-compose.dev.yml)

          for i in {1..180}; do
            if [ -n "$("${compose[@]}" ps --status running -q backend)" ]; then
              break
            fi
            "${compose[@]}" ps
            sleep 2
          done

          if [ -z "$("${compose[@]}" ps --status running -q backend)" ]; then
            "${compose[@]}" logs --no-color --tail=200 backend
            exit 1
          fi

          "${compose[@]}" exec -T backend rm -rf /tmp/python-package-under-test
          "${compose[@]}" cp "${PYTHON_PACKAGE_PATH}" backend:/tmp/python-package-under-test
          "${compose[@]}" exec -T backend python -m pip install --no-cache-dir --upgrade --force-reinstall /tmp/python-package-under-test
          "${compose[@]}" restart backend

      - name: Wait for docker app health
        run: |
          for i in {1..180}; do
            if curl -fsS http://localhost:8002/docs >/dev/null && curl -fsS http://localhost:3001 >/dev/null; then
              exit 0
            fi
            docker compose --env-file deployment/.env.e2e -f deployment/docker-compose.dev.yml ps
            sleep 2
          done

          docker compose --env-file deployment/.env.e2e -f deployment/docker-compose.dev.yml logs --no-color --tail=200
          exit 1

      - name: Verify E2E seed data
        run: |
          npm run docker:e2e:seed

          compose=(docker compose --env-file deployment/.env.e2e -f deployment/docker-compose.dev.yml)
          record_group_id="6674a33a398907ecaeb2e574"
          expected_record_count="17"

          mongo_summary=$("${compose[@]}" exec -T mongodb mongosh isgs_e2e --quiet --eval "
            const recordGroupId = '${record_group_id}';
            print(JSON.stringify({
              db: db.getName(),
              projects: db.projects.countDocuments({ name: 'ISGS Project' }),
              recordGroups: db.record_groups.countDocuments({
                _id: ObjectId(recordGroupId),
                name: 'Precambrian_WellCompletion_1'
              }),
              recordsForGroup: db.records.countDocuments({ record_group_id: recordGroupId }),
              seededRecord: db.records.countDocuments({
                record_group_id: recordGroupId,
                name: '121190087702_WELL_COMPLETION_REPORT_1'
              })
            }));
          ")
          echo "Mongo seed summary: ${mongo_summary}"

          mongo_record_count=$(echo "${mongo_summary}" | jq -r '.recordsForGroup')
          if [ "${mongo_record_count}" != "${expected_record_count}" ]; then
            echo "Expected ${expected_record_count} Mongo records for ${record_group_id}, found ${mongo_record_count}."
            "${compose[@]}" logs --no-color --tail=200 mongodb mongo-restore backend
            exit 1
          fi

          api_response=$(curl -fsS -X POST "http://localhost:8002/get_records/record_group?page=0&records_per_page=100" \
            -H "Content-Type: application/json" \
            --data "{\"sort\":[\"dateCreated\",1],\"filter\":{},\"id\":\"${record_group_id}\"}")
          echo "Backend get_records summary: $(echo "${api_response}" | jq -c '{record_count, returned_records: (.records | length), first_record: (.records[0].name // null)}')"

          api_record_count=$(echo "${api_response}" | jq -r '.record_count')
          api_returned_records=$(echo "${api_response}" | jq -r '.records | length')
          if [ "${api_record_count}" != "${expected_record_count}" ] || [ "${api_returned_records}" = "0" ]; then
            echo "Expected backend API to return ${expected_record_count} records for ${record_group_id}."
            "${compose[@]}" logs --no-color --tail=200 backend
            exit 1
          fi

      - name: Run E2E tests
        run: npm run e2e:ci

      - name: Debug E2E data after test failure
        if: failure()
        run: |
          compose=(docker compose --env-file deployment/.env.e2e -f deployment/docker-compose.dev.yml)
          record_group_id="6674a33a398907ecaeb2e574"
          seeded_record_id="6674a36da6bd70da99aa03ff"
          next_record_id="6674a36d4cde4e8ee6caec8b"

          echo "Docker compose status:"
          "${compose[@]}" ps || true

          echo "Post-failure Mongo summary:"
          if [ -n "$("${compose[@]}" ps --status running -q mongodb || true)" ]; then
            "${compose[@]}" exec -T mongodb mongosh isgs_e2e --quiet --eval "
              const recordGroupId = '${record_group_id}';
              print(JSON.stringify({
                db: db.getName(),
                projects: db.projects.countDocuments({ name: 'ISGS Project' }),
                recordGroups: db.record_groups.countDocuments({
                  _id: ObjectId(recordGroupId),
                  name: 'Precambrian_WellCompletion_1'
                }),
                recordsForGroup: db.records.countDocuments({ record_group_id: recordGroupId }),
                seededRecord: db.records.countDocuments({ _id: ObjectId('${seeded_record_id}') }),
                nextRecord: db.records.countDocuments({ _id: ObjectId('${next_record_id}') }),
                reviewStatusCounts: db.records.aggregate([
                  { \$match: { record_group_id: recordGroupId } },
                  { \$group: { _id: '\$review_status', count: { \$sum: 1 } } },
                  { \$sort: { _id: 1 } }
                ]).toArray()
              }));
            " || true
          else
            echo "MongoDB container is not running."
          fi

          post_json() {
            local url="$1"
            local body="$2"
            local label="$3"
            local response
            local status
            local payload

            response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST "${url}" \
              -H "Content-Type: application/json" \
              --data "${body}" || true)
            status=$(echo "${response}" | sed -n 's/^HTTP_STATUS://p')
            payload=$(echo "${response}" | sed '/^HTTP_STATUS:/d')

            echo "${label} HTTP status: ${status:-curl_failed}"
            if echo "${payload}" | jq -e . >/dev/null 2>&1; then
              echo "${label} summary: $(echo "${payload}" | jq -c '
                if type == "object" and has("records") then
                  {
                    record_count,
                    returned_records: (.records | length),
                    names: [.records[].name]
                  }
                elif type == "object" and has("recordData") then
                  {
                    name: .recordData.name,
                    record_group_id: .recordData.record_group_id,
                    rank: .recordData.rank,
                    previous_id: .recordData.previous_id,
                    next_id: .recordData.next_id,
                    review_status: .recordData.review_status
                  }
                else
                  .
                end
              ')"
            else
              echo "${label} raw response: ${payload}"
            fi
          }

          get_records_body="{\"sort\":[\"dateCreated\",1],\"filter\":{},\"id\":\"${record_group_id}\"}"
          post_json \
            "http://localhost:8002/get_records/record_group?page=0&records_per_page=100" \
            "${get_records_body}" \
            "Post-failure get_records"

          get_record_body="{\"location\":\"record_group\",\"group_id\":\"${record_group_id}\",\"filterBy\":{},\"sortBy\":[\"dateCreated\",1]}"
          post_json \
            "http://localhost:8002/get_record/${seeded_record_id}" \
            "${get_record_body}" \
            "Post-failure seeded get_record"
          post_json \
            "http://localhost:8002/get_record/${next_record_id}" \
            "${get_record_body}" \
            "Post-failure next get_record"

          echo "Recent backend logs:"
          "${compose[@]}" logs --no-color --tail=300 backend || true

          echo "Recent MongoDB logs:"
          "${compose[@]}" logs --no-color --tail=200 mongodb || true

      - name: Shut down docker containers
        if: always()
        run: npm run docker:e2e:clean

      - name: Upload artifact for screenshots & videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress_results-${{ matrix.os }}
          path: |
            cypress/screenshots/
            cypress/videos/
