name: App Tests

on:
  push:

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or commit to test against.
        type: string
        required: false
        # TODO: revert this back to main after passing tests are verified.
        default: cilogon
      backend_repository:
        description: Backend repository (owner/name); override to test a fork.
        type: string
        required: false
        # TODO: revert this back to CATALOG-Historic-Records/orphaned-wells-ui-server after passing tests are verified.
        default: MichaelPesce/orphaned-wells-ui-server

jobs:
  component-tests:
    name: Component testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JS dependencies
        run: npm clean-install

      - name: Run component tests
        run: npm test -- --watchAll=false --runInBand

  e2e-tests:
    name: E2E testing
    needs: component-tests
    uses: ./.github/workflows/frontend-tests-dispatch.yml
    permissions:
      contents: read
    with:
      checkout_repository: ${{ github.repository }}
      checkout_ref: ${{ github.sha }}
      backend_mode: source
      backend_repository: ${{ inputs.backend_repository || 'MichaelPesce/orphaned-wells-ui-server' }}
      backend_ref: ${{ inputs.backend_ref || 'cilogon' }}
    secrets:
      checkout_token: ${{ secrets.CHECKOUT_TOKEN }}
