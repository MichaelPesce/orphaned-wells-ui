name: Deploy Collaborator Frontend

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'CATALOG-Historic-Records/orphaned-wells-ui'
    runs-on: ubuntu-latest
    outputs:
      collab: ${{ steps.collab.outputs.collab }}
      should_deploy: ${{ steps.collab.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if branch is a collaborator
        id: collab
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          ENABLE_APP_ENGINE_DEPLOYMENTS: ${{ vars.ENABLE_APP_ENGINE_DEPLOYMENTS }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ -f collaborators.json ] && jq -e --arg b "$BRANCH" 'index($b) != null' collaborators.json > /dev/null; then
            echo "collab=$BRANCH" >> "$GITHUB_OUTPUT"
            if [ "$IS_DISPATCH" = "true" ] || [ "$ENABLE_APP_ENGINE_DEPLOYMENTS" != "false" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Deploying to collaborator environment: $BRANCH"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Branch '$BRANCH' is a recognized collaborator, but deployments are paused (ENABLE_APP_ENGINE_DEPLOYMENTS is set to 'false')."
            fi
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Branch '$BRANCH' is not a recognized collaborator in collaborators.json. Skipping deployment."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-dispatch.yml
    with:
      collaborator: ${{ needs.check.outputs.collab }}
      app_yaml: auto
    secrets: inherit

